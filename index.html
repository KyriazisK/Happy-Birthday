<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Happy Birthday, Irene! ✨</title>
  
  <!-- Meta tags for social sharing preview -->
  <meta name="description" content="A special birthday wish for Irene ✨">
  <meta property="og:title" content="Happy Birthday, Irene! ✨">
  <meta property="og:description" content="A special little something made just for your birthday.">
  <meta property="og:type" content="website">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Caveat:wght@600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Background canvas for starry sky & glowing floating motes -->
  <canvas id="sky-canvas"></canvas>

  <!-- Sound Toggle / Vinyl Player Widget -->
  <div class="vinyl-widget" id="vinylWidget" title="Click to play / pause music">
    <div class="vinyl-record" id="vinylRecord">
      <div class="vinyl-grooves"></div>
      <div class="vinyl-label">
        <span class="music-icon">🎵</span>
      </div>
    </div>
    <div class="tonearm" id="toneArm"></div>
    <div class="music-status">
      <span class="music-title">Birthday Melody</span>
      <span class="music-hint" id="musicHint">Tap to Play ♫</span>
    </div>
  </div>

  <!-- Main Container / Experience Flow -->
  <main class="experience-container">

    <!-- STEP 1: The Sealed Envelope -->
    <section class="step-section active" id="stepEnvelope">
      <div class="envelope-intro">
        <span class="sparkle-badge">🎂 Birthday Delivery 🎂</span>
        <h1 class="glow-title">A Birthday Surprise for Irene</h1>
        <p class="envelope-subtitle">A little celebration made just for your special day ✨</p>
      </div>

      <div class="envelope-wrapper" id="envelopeWrapper">
        <div class="envelope" id="envelope">
          <div class="envelope-back"></div>
          
          <div class="letter-peek" id="letterPeek">
            <span class="peek-text">Open Me 🎉</span>
          </div>

          <div class="envelope-pocket"></div>
          <div class="envelope-flap" id="envelopeFlap"></div>

          <!-- Wax Seal -->
          <div class="wax-seal" id="waxSeal" title="Click to break the seal and open">
            <div class="wax-seal-inner">
              <span class="seal-letter">I</span>
            </div>
            <div class="seal-glow"></div>
          </div>
        </div>
        <p class="tap-hint"><span class="touch-icon">👆</span> Tap the seal to open</p>
      </div>
    </section>

    <!-- STEP 2: The Interactive Birthday Cake -->
    <section class="step-section" id="stepCake">
      <div class="cake-intro">
        <h2 class="section-title">Make a Wish, Irene 🎂</h2>
        <p class="section-desc" id="cakeHint">Make a quick wish and blow out the candles!</p>
      </div>

      <div class="cake-container" id="cakeContainer">
        <!-- The 3D CSS Birthday Cake (Right side up: Smallest on top, Widest on bottom) -->
        <div class="cake">
          <!-- Candles on top -->
          <div class="candles-row" id="candlesRow">
            <div class="candle" data-index="1">
              <div class="candle-stick"></div>
              <div class="wick"></div>
              <div class="flame"></div>
              <div class="smoke"></div>
            </div>
            <div class="candle candle-tall" data-index="2">
              <div class="candle-stick"></div>
              <div class="wick"></div>
              <div class="flame"></div>
              <div class="smoke"></div>
            </div>
            <div class="candle" data-index="3">
              <div class="candle-stick"></div>
              <div class="wick"></div>
              <div class="flame"></div>
              <div class="smoke"></div>
            </div>
          </div>

          <!-- Layer 1: Top / Smallest -->
          <div class="layer layer-top">
            <div class="cake-topper-text">Irene</div>
          </div>

          <!-- Layer 2: Middle / Medium -->
          <div class="layer layer-middle">
            <div class="frosting-drips"></div>
          </div>

          <!-- Layer 3: Bottom / Widest -->
          <div class="layer layer-bottom">
            <div class="frosting-drips"></div>
          </div>

          <!-- Plate at the bottom -->
          <div class="cake-plate"></div>
        </div>

        <button class="blow-btn" id="blowBtn">
          <span>💨 Tap Here to Blow Out the Candles!</span>
        </button>
      </div>
    </section>

    <!-- STEP 3: The Birthday Wish (Minimalist Gold Glowing Script on Sleek Glass) -->
    <section class="step-section" id="stepLetter">
      <div class="glass-card-wrapper">
        <div class="glass-card">
          <div class="glass-sparkle">✦ ✦ ✦</div>
          <h2 class="gold-script-text">Happy Birthday, Irene ✨</h2>
          
          <!-- Sleek Action Chips -->
          <div class="glass-actions">
            <button class="glass-btn" id="btnConfetti">🎉 Confetti</button>
            <button class="glass-btn" id="btnBalloons">🎈 Balloons</button>
            <button class="glass-btn" id="restartBtn">↺ Cake</button>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- Floating Balloons Container -->
  <div id="balloonsContainer"></div>

  <script src="script.js"></script>
</body>
</html>
